<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Add book list · Won Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
<style>
  body{margin:0;background:#F3F5F8;color:#16181d;font:15px/1.55 system-ui,sans-serif}
  main{max-width:620px;margin:40px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #D6DCE6;border-radius:14px;padding:22px}
  h1{font-size:24px;margin:0 0 6px}.muted{color:#5b6270}
  button{font:600 15px/1 inherit;padding:11px 16px;border:0;border-radius:9px;background:#2f5bd3;color:#fff;cursor:pointer}button[disabled]{opacity:.55}
  pre{background:#F3F5F8;border-radius:8px;padding:10px;white-space:pre-wrap;font-size:13px;max-height:280px;overflow:auto}.ok{color:#1f8a4c}
</style>
</head>
<body>
<main><div class="card">
  <h1>Add the school's book list</h1>
  <p class="muted">Adds 73 book titles to <b>Books</b> (with 0 copies — add copies and prices in the app). Books that are already there (same title) are skipped, so pressing it twice is safe. Use this once, signed in with your owner email.</p>
  <div><button id="go" disabled>Add books</button></div>
  <pre id="log" hidden></pre>
  <p id="done" hidden class="ok"><b>✓ Done.</b> <a href="./#books">Open Books</a></p>
</div></main>

": "English"}, {"id": "bk-gold-b1-c-b", "title": "Gold B1 C.B.", "language": "English"}, {"id": "bk-gold-b1-e-m", "title": "Gold B1 E.M.", "language": "English"}, {"id": "bk-gold-b2-c-b", "title": "Gold B2 C.B.", "language": "English"}, {"id": "bk-gold-b2-e-m", "title": "Gold B2 E.M.", "language": "English"}, {"id": "bk-vocabulary-in-use-upper", "title": "Vocabulary in use upper", "language": "English"}, {"id": "bk-grammar-in-use", "title": "Grammar in use", "language": "English"}, {"id": "bk-intermediate-reading", "title": "Intermediate Reading", "language": "English"}, {"id": "bk-gold-advanced-c-b", "title": "Gold Advanced C.B.", "language": "English"}, {"id": "bk-gold-advanced-e-m", "title": "Gold Advanced E.M.", "language": "English"}, {"id": "bk-advanced-reading-and-comprehension", "title": "Advanced Reading and Comprehension", "language": "English"}, {"id": "bk-english-a-the-ib-cb", "title": "English A. the IB CB", "language": "English"}, {"id": "bk-english-a-the-ib-ep", "title": "English A. the IB EP", "language": "English"}, {"id": "bk-improve-your-ielts-reading-skills", "title": "Improve Your IELTS Reading Skills", "language": "English"}, {"id": "bk-english-for-everyone-english-grammar-guide-practice-book", "title": "English for Everyone English Grammar Guide Practice Book", "language": "English"}, {"id": "bk-english-for-everyone-practice-book-level-1-beginner", "title": "English for Everyone Practice Book Level 1 Beginner", "language": "English"}, {"id": "bk-english-for-everyone-practice-book-level-2-beginner", "title": "English for Everyone Practice Book Level 2 Beginner", "language": "English"}, {"id": "bk-english-for-everyone-practice-book-level-3-intermediate", "title": "English for Everyone Practice Book Level 3 Intermediate", "language": "English"}, {"id": "bk-english-for-everyone-practice-book-level-4", "title": "English for Everyone Practice Book Level 4", "language": "English"}, {"id": "bk-efe-business-1-cb", "title": "EFE Business 1 CB", "languag  "title": "180 days of writing 4", "language": "English"}, {"id": "bk-180-days-of-writing-5", "title": "180 days of writing 5", "language": "English"}, {"id": "bk-180-days-of-writing-6", "title": "180 days of writing 6", "language": "English"}, {"id": "bk-oxford-word-elementary", "title": "Oxford word_elementary", "language": "English"}, {"id": "bk-oxford-word-intermediate", "title": "Oxford word_Intermediate", "language": "English"}, {"id": "bk-oxford-word-upper-intermediate", "title": "Oxford word_Upper Intermediate", "language": "English"}, {"id": "bk-practice-makes-perfect-basic-german", "title": "Practice makes perfect Basic German", "language": "German"}, {"id": "bk-schritte-1", "title": "Schritte 1", "language": "German"}, {"id": "bk-german-for-everyone-5-words-a-day", "title": "German for everyone 5 words a day", "language": "German"}, {"id": "bk-german-for-everyone-jr-flashcards", "title": "German for everyone JR Flashcards", "language": "German"}, {"id": "bk-easy-spanish-step-by-step", "title": "Easy Spanish step by step", "language": "Spanish"}, {"id": "bk-cestina-expres", "title": "Čeština expres", "language": "Czech"}];
(async function(){
  const go=document.getElementById("go"),log=document.getElementById("log");const say=t=>{log.hidden=false;log.textContent+=t+"\n";log.scrollTop=1e9};
  await window.claude.use("db"); go.disabled=false;
  go.onclick=async()=>{go.disabled=true;const sb=window.__sb;
    const {data:have,error:e1}=await sb.from("docs").select("id,data").eq("collection","bookstock");
    if(e1){say("✗ "+e1.message+" (Are you signed in with the owner email?)");go.disabled=false;return}
    const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");const titles=new Set((have||[]).map(r=>norm(r.data&&r.data.title)));const ids=new Set((have||[]).map(r=>r.id));
    const now=new Date().toISOString();
    const rows=BOOKS.filter(b=>!titles.has(norm(b.title))&&!ids.has(b.id)).map(b=>({collection:"bookstock",id:b.id,data:{title:b.title,language:b.language,received:0,note:"",createdAt:now,updatedAt:now}}));
    say("Already in Books: "+(BOOKS.length-rows.length)+" · to add: "+rows.length);
    if(rows.length){const {error}=await sb.from("docs").upsert(rows);if(error){say("✗ Stopped: "+error.message);go.disabled=false;return}}
    say("Added "+rows.length+" books.");document.getElementById("done").hidden=false};
})();
</script>
</body>
</html>
