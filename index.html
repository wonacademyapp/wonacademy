<style>
/* Layout: register-book office app. Left rail of sections, a working sheet on the right; tabs on top at phone width. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --line:#D6DCE6;
  --fg:#172033; --muted:#5B6578; --accent:#1F47C4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --good:#11795A; --good-soft:#DDF3EA; --warn:#A85F00; --warn-soft:#FCEFD9; --bad:#B3261E; --bad-soft:#FBE3E1; --info-soft:#E8ECF4; --alt:#6B3FB8; --alt-soft:#EEE6FA; --pay-yes:#D7E4F6; --pay-no:#F8DFD2; --pay-grey:#D6D7DC;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
  --rm-yellow:#FFF34D; --rm-green:#BCF3A1; --rm-blue:#7FD3FF; --rm-purple:#A77CFF; --rm-orange:#F9883F; --rm-pink:#F3A6E2; --rm-grey:#CFCFD6; --rm-ink:#141414;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141E; --surface:#171E2B; --sunk:#1E2635; --line:#2B3547;
  --fg:#E6EAF2; --muted:#9AA4B8; --accent:#7D9BFF; --accent-ink:#0B1020; --accent-soft:#1F2B4D;
  --good:#4FCB9C; --good-soft:#123326; --warn:#F2B357; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1B19; --info-soft:#222B3B; --alt:#C4A6FF; --alt-soft:#2C2142; --pay-yes:#1E3354; --pay-no:#4A2A1E; --pay-grey:#3A3D46; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141E; --surface:#171E2B; --sunk:#1E2635; --line:#2B3547;
  --fg:#E6EAF2; --muted:#9AA4B8; --accent:#7D9BFF; --accent-ink:#0B1020; --accent-soft:#1F2B4D;
  --good:#4FCB9C; --good-soft:#123326; --warn:#F2B357; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1B19; --info-soft:#222B3B; --alt:#C4A6FF; --alt-soft:#2C2142; --pay-yes:#1E3354; --pay-no:#4A2A1E; --pay-grey:#3A3D46; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;padding:4px 10px 16px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
main{padding-block:24px 64px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));min-width:0;max-width:1200px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.015em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
.inline-sel{width:auto}
.month{display:flex;align-items:center;gap:4px}
.month span{font-family:var(--f-mono);font-weight:500;min-width:120px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{text-align:right;font-family:var(--f-body)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--info-soft);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.st{border-radius:99px;padding:3px 8px;font-size:12.5px;font-weight:600;border:1px solid transparent;width:auto;cursor:pointer}
.st.scheduled{background:var(--accent-soft);color:var(--accent)}
.st.done{background:var(--good-soft);color:var(--good)}
.st.absent{background:var(--warn-soft);color:var(--warn)}
.st.changed{background:var(--alt-soft);color:var(--alt)}
.st.tnoshow{background:var(--bad);color:#fff}
.st.cancel{background:var(--info-soft);color:var(--muted);text-decoration:line-through}
.st.latecancel{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);border-style:dashed}
.st.nextmonth{background:var(--alt-soft);color:var(--alt);border-color:var(--alt);border-style:dashed}
.st.makeup{background:var(--good-soft);color:var(--good);border-color:var(--good);border-style:dashed}
.st.cancelled{background:var(--bad-soft);color:var(--bad)}
.st.rescheduled,.st.other{background:var(--info-soft);color:var(--muted)}
.punch{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.punch i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--good);display:block}
.punch i.f{background:var(--good)}
.punch i.o{border-color:var(--bad);background:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .t{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:44px}
.li .m{flex:1;min-width:160px}
.li .m b{font-weight:600}
.empty{color:var(--muted);padding:12px 0}
.daygrp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:14px 12px 6px;background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card h3{margin:0;font-size:15.5px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.notice{padding:40px 0;color:var(--muted);max-width:60ch}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mh h2{margin:0;font-size:21px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.checks{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px}
.checks label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);font-size:14px}
.checks input{width:auto}
.mf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px}
.info-grid div span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.bal{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding:14px;background:var(--sunk);border-radius:var(--r)}
.bal div b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.bal div span{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:60}
.search{max-width:240px}
/* classrooms */
.days{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:0}
.days button{border:0;background:transparent;padding:9px 14px 10px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:92px;border-radius:6px 6px 0 0}
.days button:hover{background:var(--sunk)}
.days button b{font-weight:600;font-size:14px}
.days button small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.days button .c{font-family:var(--f-mono);font-size:11px;background:var(--info-soft);color:var(--muted);border-radius:99px;padding:0 7px;margin-top:2px}
.days button[aria-selected="true"]{border-bottom-color:var(--accent)}
.days button[aria-selected="true"] b{color:var(--accent)}
.days button[aria-selected="true"] .c{background:var(--accent-soft);color:var(--accent)}
.days button.today small{color:var(--accent)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.room{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.room.none{border-style:dashed}
.room-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.room-h b{font-family:var(--f-display);font-weight:600;font-size:16px}
.room-h small{color:var(--muted);font-size:12px;display:block}
.room-b{display:flex;flex-direction:column;gap:8px;padding:10px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.lcard:hover{border-color:var(--muted)}
.lcard.clash{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.lcard.off{opacity:.62}
.lcard .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.lcard .who{font-weight:600}
.lcard .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.room-empty{color:var(--muted);font-size:13px;padding:6px 2px}
/* classroom sheet */
.sheet-wrap{overflow-x:auto;border:1.5px solid #222;border-radius:4px;margin-bottom:8px}
.sheet-t{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed}
.sheet-t th,.sheet-t td{border:1.5px solid #222;padding:0;vertical-align:middle;color:var(--rm-ink);min-width:118px}
.sheet-t th{text-transform:none;letter-spacing:0;font-size:13px}
.sheet-t .plain{background:var(--surface);color:var(--fg)}
.sheet-t th.plain{background:var(--sunk)}
.sheet-t .sl{width:58px;min-width:58px;background:var(--sunk);color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center;font-weight:500}
.sheet-t td .rc{border-bottom:0}
.sheet-t td .rc+.rc{border-top:1.5px dashed rgba(0,0,0,.4)}
.scol{display:flex;flex-direction:column;border-right:1.5px solid #222;color:var(--rm-ink);min-width:0}
.scol:last-child{border-right:0}
.scol.plain{background:var(--surface);color:var(--fg)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 8px;font-weight:700;font-size:13px;background:rgba(255,255,255,.35)}
.scol.plain .sh{background:var(--sunk)}
.sh-b{display:flex;gap:3px}
.mini{border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.6);color:#141414;border-radius:4px;font-size:11.5px;padding:0 6px;cursor:pointer;line-height:1.6}
.rc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:7px 6px;border-bottom:1.5px solid #222;cursor:pointer;line-height:1.3;gap:1px}
.rc:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.rc-t{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-n{font-size:15px;overflow-wrap:anywhere}
.rc-d{font-size:13px;font-weight:600}
.rc-te{font-size:11.5px;opacity:.75}
.rc .cst{font-size:11px;padding:0 7px;margin-top:3px}
.rc.off .rc-n{text-decoration:line-through}
.rc.off{opacity:.6}
.rc.clash{box-shadow:inset 0 0 0 3px var(--bad)}
.rc-free{padding:10px 6px;font-size:12.5px;opacity:.6;text-align:center}
.wday{margin-bottom:22px}
/* fee sheet */
.paytbl td{padding:7px 10px}
.paytbl .pno{color:var(--muted);width:48px}
.pc{width:170px;padding:0!important}
.pc.yes{background:var(--pay-yes)}
.pc.no{background:var(--pay-no)}
.pc-in{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:7px 10px}
.ptog{border:1px solid rgba(0,0,0,.18);background:var(--surface);border-radius:6px;font-size:12.5px;font-weight:600;padding:3px 6px;cursor:pointer;width:auto}
.pc.yes .ptog{color:#1F47C4}.pc.no .ptog{color:var(--bad)}
.ptxt{font-size:11.5px;font-weight:600}
.pnote{font-size:13px;color:var(--muted);max-width:320px}
.secrow td{background:var(--sunk);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);padding:5px 10px}
.paytbl tr.tot td{border-top:2px solid var(--line)}
.tptbl{min-width:900px}
.tptbl .pc{width:auto}
.tptbl .pc.yes{background:var(--pay-grey)}
.tptbl .pc.no{background:transparent}
.tptbl .pc.yes .ptog{color:var(--fg)}
.pw{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:6px 10px}
.pw-amt{border:0;background:transparent;text-align:right;cursor:pointer;color:inherit;padding:0;display:flex;flex-direction:column;align-items:flex-end}
.pw-amt small,.pw .pd{font-size:11.5px;color:var(--muted)}
.pw-amt:hover b{text-decoration:underline}
.pw-empty{text-align:right}
.pw-add{opacity:.45}.pw-add:hover,.pw-add:focus-visible{opacity:1}
.tv-wrap{max-width:760px}
.pv-kids{margin:-4px 0 12px}
.tv-preview{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.tv-who{display:flex;gap:6px;align-items:center;font-weight:600}
.tv-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tv-weeknav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tv-todo{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:var(--r);padding:9px 12px;margin-bottom:12px;font-size:13.5px}
.tv-day{margin-bottom:18px}
.tv-day h2{font-size:16px;margin-bottom:8px}
.tv-day.today h2{color:var(--accent)}
.tv-card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--rc);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tv-time{font-family:var(--f-mono);font-weight:500;font-size:15px}

.tb{background:var(--surface);border-style:dashed}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;z-index:20}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{padding:0 10px 0 0;font-size:17px;white-space:nowrap}

  main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:18px 48px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.fgrid{grid-template-columns:minmax(0,1fr)}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}}}

/* ---- modern lesson cards (Teachers sheet + Timetable) ---- */
.ts-l{--rc:var(--line);background:color-mix(in srgb,var(--rc) 38%,#fff)!important;color:#16181d!important;box-shadow:inset 4px 0 var(--rc);text-align:left;padding:7px 8px 8px 12px!important;vertical-align:top!important;line-height:1.3}
.ts-l:hover{box-shadow:inset 4px 0 var(--rc),inset 0 0 0 1.5px rgba(0,0,0,.2)}
.ts-l.clash{box-shadow:inset 4px 0 var(--rc),inset 0 0 0 2.5px var(--bad)}
.ts-l.off{opacity:.55}
.ts tr.ts-first>.ts-l{box-shadow:inset 4px 0 var(--rc),inset 0 2px 0 #222}
.ts tr.ts-first>.ts-l:hover{box-shadow:inset 4px 0 var(--rc),inset 0 2px 0 #222,inset 0 0 0 1.5px rgba(0,0,0,.2)}
.ts tr.ts-first>.ts-l.clash{box-shadow:inset 4px 0 var(--rc),inset 0 0 0 2.5px var(--bad)}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px}
.lc-top .ts-tm,.lc-top .tm{display:flex;align-items:center;justify-content:flex-start;gap:0;padding:0;font:600 13.2px/1.2 var(--f-mono);color:#000;white-space:nowrap}
.lc-top .ts-time{width:calc(5ch + 6px);box-sizing:border-box;text-align:left;font:600 13.2px var(--f-mono);color:#000;background:transparent;border:1px solid transparent;border-radius:4px;padding:0 1px}
.lc-top .ts-time:hover{border-color:rgba(0,0,0,.18)}
.lc-top .ts-time:focus{background:#fff;border-color:rgba(0,0,0,.35);color:#16181d;outline:none}
.lc-top .ts-tm>span{opacity:.6;margin:0 2px}
.lc-top .ts-room{width:auto;min-width:22px;height:20px;padding:0 6px;border:0;border-radius:6px;font:800 11px/20px var(--f-sans,system-ui),sans-serif;letter-spacing:.04em;background:var(--rc,#fff);color:#16181d;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);transform:none;flex:none}
.lc-top .ts-room:hover{background:#16181d;color:#fff;transform:none;box-shadow:none}
.lc-top .ts-room:has(option[value=""]:checked){background:transparent;color:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ts-l .ts-stu{text-align:left;font-size:14.5px;font-weight:700;letter-spacing:-.01em;text-decoration:none;padding:1px 2px;margin:3px 0 0 -2px;color:#16181d}
.ts-l .ts-stu:hover{background:rgba(255,255,255,.6)}
.ts-l .ts-open{text-align:left;text-decoration:none;padding:0;margin-top:3px}
.ts-l .ts-r3{justify-content:flex-start}
.ts-l .rc-d{font-size:10.4px;font-weight:500;color:rgba(22,24,29,.55)}
.ts-l .cst{margin-top:5px}
.ts-l .ts-stu{text-overflow:ellipsis}
.ts-l>.late-tag,.ts-l>span.chip,.ts-l>.mv-tag,.ts-l>.rc-tag{margin-top:5px}
.ts-l{text-align:left!important}
.ts-l .rc-te{color:rgba(22,24,29,.6)}
.tb{--rc:var(--line);text-align:left;border:0!important;border-radius:10px;background:color-mix(in srgb,var(--rc) 36%,#fff);color:#16181d;box-shadow:inset 3px 0 var(--rc),0 1px 2px rgba(16,24,40,.08);padding:7px 8px 8px 11px;transition:box-shadow .12s}
.tb:hover{box-shadow:inset 3px 0 var(--rc),0 4px 12px rgba(16,24,40,.14)}
.tb:not([style]){background:var(--surface);color:var(--fg)}
.tb .nm{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.tb .nm a{text-decoration:none}
.tb .tt-t{display:block;font-size:11.5px;color:rgba(22,24,29,.58)}
.tb .du{display:block;font-size:10.4px;color:rgba(22,24,29,.58)}
.tb:not([style]) .tt-t,.tb:not([style]) .du{color:var(--muted)}
.tb select.st{margin-top:6px;border-radius:99px}

/* centred layout */
.ts-l,.ts-l *{text-align:center}
.ts-l{text-align:center!important;padding:7px 10px 8px 12px!important}
.ts-l,.tb{position:relative}
.lc-top{justify-content:center;gap:6px;padding:0;flex-wrap:nowrap}
.lc-top .ts-tm,.lc-top .tm{justify-content:center}
.lc-top .ts-time{text-align:center}
.lc-top .ts-room{position:static;flex:none}
.ts-l .ts-stu{text-align:center;margin:3px 0 0}
.ts-l .ts-open{text-align:center}
.ts-l .ts-r3{justify-content:center}
.tb{text-align:center}
.ctx-menu.lm{max-height:calc(100vh - 16px);overflow:auto;min-width:220px}
.ctx-sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 2px}
.ctx-menu.lm button{display:flex;align-items:center;gap:8px}
.ctx-dot{width:9px;height:9px;border-radius:50%;padding:0!important;flex:none;border:1px solid rgba(0,0,0,.15)}
.ctx-ok{margin-left:auto;color:var(--accent,#2b59c3)}
.ctx-sep{height:1px;background:var(--line);margin:4px 2px}
.ctx-menu .ctx-del{color:var(--bad)}
.ts-stu::-webkit-calendar-picker-indicator,.ts-stu::-webkit-list-button{display:none!important;opacity:0;width:0;margin:0;padding:0}
.ts-l .ts-stu{display:block;width:100%;box-sizing:border-box;padding:1px 0;text-align:center}
.modal.ds-modal{max-width:min(1180px,calc(100vw - 32px))}
.ds-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ds-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ds-wrap{overflow:auto;max-height:calc(100dvh - 220px);border:1px solid var(--line);border-radius:10px}
.ds{border-collapse:collapse;width:100%;min-width:760px}
.ds th,.ds td{border:1px solid var(--line);padding:6px;vertical-align:top}
.ds thead th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.ds .ds-tn{text-align:left;white-space:nowrap;font-size:14px;width:110px}
.ds td{min-width:118px}
.ds-l{--rc:var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;margin:0 0 5px;padding:6px 6px 7px;border:0;border-radius:8px;background:color-mix(in srgb,var(--rc) 38%,#fff);box-shadow:inset 3px 0 var(--rc);color:#16181d;cursor:pointer;font:inherit}
.ds-l:hover{box-shadow:inset 3px 0 var(--rc),inset 0 0 0 1.5px rgba(0,0,0,.2)}
.ds-t{font:600 12.5px var(--f-mono);color:#000;display:flex;gap:5px;align-items:center}
.ds-r{font:800 10px/16px var(--f-sans,inherit);min-width:16px;padding:0 4px;border-radius:4px;background:var(--rc);border:1px solid rgba(0,0,0,.15)}
.ds-n{font-weight:700;font-size:13.5px;text-align:center}
.ds-d{font-size:10.5px;color:rgba(22,24,29,.55)}
.ds-add{width:100%;border:1px dashed var(--line);background:none;border-radius:8px;color:var(--muted);cursor:pointer;padding:2px 0;opacity:.5}
.ds td:hover .ds-add,.ds-add:focus{opacity:1}
.rail{z-index:30}
.ur{display:flex;gap:6px;padding:0 10px 12px}
.ur:empty{display:none}
.ur-g{display:flex;position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ur-b{display:grid;place-items:center;width:34px;height:30px;border:0;background:none;color:var(--fg);cursor:pointer;border-radius:7px 0 0 7px}
.ur-b:hover:not([disabled]),.ur-c:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.ur-b[disabled]{color:var(--muted);opacity:.45;cursor:default}
.ur-dd{position:static}
.ur-c{list-style:none;display:grid;place-items:center;width:20px;height:30px;font-size:10px;color:var(--muted);cursor:pointer;border-left:1px solid var(--line);border-radius:0 7px 7px 0}
.ur-c::-webkit-details-marker{display:none}
.ur-menu{position:fixed;z-index:60;width:260px;max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:4px}
.ur-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.ur-it{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font:inherit;font-size:13.5px;color:var(--fg);cursor:pointer}
.ur-it:hover,.ur-it:focus{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ur-it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ur-it small{color:var(--muted);white-space:nowrap}
.ur-it.hl{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ur-none{padding:8px 10px;color:var(--muted);font-size:13px}
.rc.rs-sel,.sheet-t td.rs-sel{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.rc.rs-cut{outline:2px dashed #222;outline-offset:-3px;opacity:.6}
.rc.rs-drag{opacity:.4}
.sheet-t td.rs-over{box-shadow:inset 0 0 0 3px var(--accent);background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35))}
.sheet-t td[data-rs]{height:44px}
.rc[draggable="true"]{cursor:grab}
.ctx-k{margin-left:auto;padding-left:16px;color:var(--muted);font-size:12px}
.ctx-menu button{display:flex;align-items:center}
.acc-t td{vertical-align:middle}
.acc-mail{width:100%;min-width:200px;max-width:340px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit}
.acc-mail:focus{outline:2px solid var(--accent);outline-offset:-1px}
.acc-st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.acc-ok{background:color-mix(in srgb,#2e9e5b 16%,transparent);color:#1f7a44}
.acc-no{background:var(--sunk);color:var(--muted)}
.acc-wait{border-color:color-mix(in srgb,var(--warn,#d98a00) 50%,var(--line));background:color-mix(in srgb,var(--warn,#d98a00) 7%,var(--surface))}
.tv-lay{display:flex;align-items:center;gap:4px;margin:0 0 8px;font-size:13px}
.tv-lay button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:4px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.tv-lay button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.tv-ov-l{font:inherit;color:#16181d;cursor:pointer;width:100%;position:relative}
button.tv-ov-l:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
button.tv-ov-l:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tv-ov-wrap.fit{overflow:hidden}
.tv-ov-wrap.fit .tv-ov{min-width:0}
.tv-ov-wrap.fit .tv-ov-h{padding:5px 1px}
.tv-ov-wrap.fit .tv-ov-h b{font-size:14px}.tv-ov-wrap.fit .tv-ov-h span{font-size:10.5px}
.tv-ov-wrap.fit .tv-ov-c{padding:3px 2px;gap:3px;min-width:0}
.tv-ov-wrap.fit .tv-ov-l{padding:4px 2px;font-size:11px;gap:0;min-width:0;border-radius:5px}
.tv-ov-wrap.fit .tv-ov-l .mono{font-size:11px;letter-spacing:-.02em}
.tv-ov-wrap.fit .tv-ov-l .nm{font-size:11.5px;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.tv-ov-wrap.fit .tv-ov-l .du{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-dot{position:absolute;top:-4px;right:-3px;width:15px;height:15px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:9.5px;line-height:15px;font-weight:800}
.tv-ov-l.marked .tm-dot{background:#2e7d4f;color:#fff}
@keyframes tvflash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.tv-card.tv-flash{animation:tvflash 1.8s ease-out}
.tv-nacts{margin-left:auto;display:inline-flex;gap:4px}
.tv-nbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}
.tv-nbtn:hover{border-color:var(--fg)}
.tv-nbtn.del{color:var(--bad)}
.tv-nh{flex-wrap:wrap}
.ns{margin-top:6px}
.ns-replies{display:flex;flex-direction:column;gap:5px;margin:4px 0 6px;padding-left:10px;border-left:3px solid var(--line)}
.ns-r{font-size:13px}.ns-r.off{border-left:0}.ns-r.off b{color:var(--accent)}
.ns-r>div{white-space:pre-wrap}
.ns-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0 4px}
.ns-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ns-e{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:1px 8px;font-size:13px;cursor:pointer;line-height:1.6;color:var(--fg)}
.ns-e span{font-size:11.5px;color:var(--muted)}
.ns-e.on{background:var(--accent-soft);border-color:var(--accent)}
.ns-rep{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 6px}
.tv-replies{margin:0 0 14px;padding:10px 12px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-soft)}
.tv-replies h2{margin:0 0 6px;font-size:16px}
.tv-replies .tv-note{background:var(--surface)}
.ar-note.tch-old{opacity:.7;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.3)}
.ar-prob{border-left:4px solid var(--bad)}
.ar-prob.fresh{background:color-mix(in srgb,var(--bad) 5%,var(--surface))}
.rail{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (min-width:861px){.rail{height:100vh;height:100dvh;max-height:100dvh}}
.ts-left .ur{padding:0}
.hw-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.hw-tools .tv-lay{margin:0}
.hw-tools input[type=search]{min-width:220px;flex:1;max-width:340px}
.hw-day{font-size:15px;margin:16px 0 6px}
.hw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hw-item{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hw-stu a{color:inherit}
.tv-savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;padding:10px;border-radius:10px;background:var(--accent-soft)}
.tv-savebar .muted{font-size:12.5px;flex-basis:100%}
.tv-btn.save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.pend{outline:2px dashed #c77a00!important;outline-offset:-4px}
.pend-tag{display:block;margin:4px auto 0;max-width:100%;border:0;border-radius:99px;background:#ffe9b8;color:#6b4100;font-family:inherit;font-weight:600;font-size:11px;line-height:1.5;padding:1px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.pend::after,.rc.pend::after{content:"⏳";position:absolute;top:3px;left:5px;font-size:12px}
.rc.pend{position:relative}
.pend-btn.has{background:#ffe9b8;border-color:#e0a63a;color:#6b4100}
.pend-btn b{margin-left:2px}
.pend-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100dvh - 200px);overflow:auto}
.pend-row{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid #e0a63a;border-radius:10px;background:var(--surface)}
.pend-row.due{background:color-mix(in srgb,#e0a63a 10%,var(--surface))}
.pend-when{display:flex;flex-direction:column;gap:2px}
.pend-note{margin:3px 0;font-weight:600}
.pend-acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:600px){.pend-row{grid-template-columns:1fr}}
@keyframes pendflash{0%,50%{box-shadow:0 0 0 4px #e0a63a}100%{box-shadow:none}}
.pend-flash{animation:pendflash 1.8s ease-out}
.ts th.ts-addcol{width:34px;min-width:34px;padding:0;background:var(--sunk)}
.ts th.ts-addcol .tadd{opacity:.8;width:28px;height:28px}
.ts thead th[data-dayhdr]{cursor:context-menu}
.ts td.ts-addcol{background:var(--sunk);border-left:1px solid var(--line)}
.share-btn.has{background:var(--accent);color:#fff;border-color:var(--accent)}
.share-btn b{margin-left:3px;background:rgba(255,255,255,.25);padding:0 6px;border-radius:99px}
.share-btn:not(.has){color:#fff;background:#2e9e5b;border-color:#2e9e5b}
.sh-t h3{margin:8px 0 4px;font-size:14px}
.sh-row{padding:5px 8px;border-radius:8px;background:var(--sunk);margin:0 0 4px;font-size:13.5px}
.sh-what{color:var(--accent);font-weight:600}.sh-what.new{color:#1f7a44}
.rg-wrap{overflow:auto;border:2px solid #222;border-radius:4px;background:var(--surface);max-height:calc(100dvh - 230px)}
.rg{display:grid;position:relative}
.rg-corner,.rg-h{position:sticky;top:0;z-index:3;border-bottom:2px solid #222;padding:6px 8px;font-size:13px;font-weight:700;background:var(--sunk)}
.rg-corner{left:0;z-index:4;color:var(--muted);font-weight:500;text-align:center}
.rg-h{border-left:1px solid #222;color:#16181d}
.rg-h.plain{background:var(--sunk);color:var(--fg)}
.rg-axis{position:sticky;left:0;z-index:2;background:var(--sunk);border-right:1px solid var(--line)}
.rg-axis span{position:absolute;right:6px;transform:translateY(-50%);font:600 11.5px var(--f-mono);color:var(--fg)}
.rg-axis span.half{color:var(--muted);font-weight:400;font-size:10.5px}
.rg-axis span:first-child{transform:none}
.rg-col{--rc:var(--line);position:relative;border-left:1px solid #222;background:color-mix(in srgb,var(--rc) 14%,var(--surface));background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,transparent 1px calc(30px*var(--px)*1),rgba(0,0,0,.05) calc(30px*var(--px)) calc(30px*var(--px) + 1px),transparent calc(30px*var(--px) + 1px) calc(60px*var(--px)))}
.rg-col.plain{background-color:var(--surface)}
.rg-col.freed{background-color:var(--sunk);opacity:.85}
.rg-col.rs-sel{box-shadow:inset 0 0 0 3px var(--accent)}
.rg-col.rs-over{box-shadow:inset 0 0 0 3px var(--accent);background-color:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.rc.rg-l{position:absolute;margin:0;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 4px;border-radius:7px;background:color-mix(in srgb,var(--rc) 60%,#fff);border:1px solid rgba(0,0,0,.25);box-shadow:inset 3px 0 var(--rc);color:#16181d;text-align:center;line-height:1.25}
.rc.rg-l .rc-t{font:600 12px var(--f-mono);color:#000}
.rc.rg-l .rc-n{font-size:14px}
.rc.rg-l .rc-te{font-size:11px;color:rgba(22,24,29,.65)}
.rc.rg-l.tiny{flex-direction:row;flex-wrap:wrap;gap:0 6px}
.rc.rg-l.tiny .rc-n{font-size:12.5px}
.rc.rg-l.clash{border:2px solid var(--bad)}
.rg-col.plain .rc.rg-l{background:var(--surface)}
.rg-gap{position:absolute;left:3px;right:3px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.rg-gap span{font-size:10.5px;font-weight:600;color:#1f7a44;background:rgba(255,255,255,.75);padding:0 6px;border-radius:99px;white-space:nowrap}
.rg-gap.short span{color:#8a5a00}
.rg-gap.short{background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 4px,transparent 4px 8px)}
.rc.rg-l .rc-tn{font-size:12.5px;font-weight:700;color:#16181d;background:rgba(255,255,255,.6);padding:0 7px;border-radius:99px;margin:2px 0 1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rc.rg-l.tiny .rc-tn{margin:0;font-size:11.5px}
.rc.rg-l .rc-te{font-size:10.5px}
.rg-sq{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.07) 0 6px,transparent 6px 12px);border-top:1px dashed rgba(0,0,0,.25);border-bottom:1px dashed rgba(0,0,0,.25)}
.rg-axis span.sq{right:auto;left:50%;transform:translate(-50%,-50%);font-size:16px;color:var(--muted)}
.rg-col{background-image:none!important}
.rg-tick{position:absolute;left:0;right:0;height:0;border-top:1px solid rgba(0,0,0,.14);pointer-events:none}
.rg-tick.half{border-top-color:rgba(0,0,0,.06)}

/* ---------- balances ---------- */
function stuStats(sid){
  const pays=arr("payments").filter(p=>p.studentId===sid);
  const les=arr("lessons").filter(l=>l.studentId===sid);
  const prepaid=pays.reduce((a,p)=>a+(Number(p.lessons)||0),0);
  const paid=pays.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const used=les.filter(isCharged).length;
  const upcoming=les.filter(l=>l.status==="scheduled").length;
  return {prepaid,paid,used,remaining:prepaid-used,upcoming,pays,les};
}
function ledger(sid,m){
  const pays=arr("payments").filter(p=>p.studentId===sid), les=arr("lessons").filter(l=>l.studentId===sid&&isCharged(l));
  const bBefore=pays.filter(p=>mOf(p.date)<m).reduce((a,p)=>a+(Number(p.lessons)||0),0);
  const uBefore=les.filter(l=>mOf(l.date)<m).length;
  const inM=pays.filter(p=>mOf(p.date)===m);
  const bought=inM.reduce((a,p)=>a+(Number(p.lessons)||0),0);
  const paidM=inM.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const done=les.filter(l=>mOf(l.date)===m).length;
  const carriedIn=bBefore-uBefore;
  const moved=arr("lessons").filter(l=>l.studentId===sid&&mOf(l.date)===m&&l.status==="rescheduled").length;
  return {carriedIn,bought,paidM,done,moved,carriedOut:carriedIn+bought-done};
}

function suggestBox(input,getItems,onPick){let box=null,hi=-1,items=[];

function bankDecide(tx,T){
  const hits=T[tx.vs]||[];
  if(!tx.vs)return {state:"none",text:"No variable symbol"};
  if(!hits.length)return {state:"none",text:"No fee with this symbol"};
  if(hits.length>1)return {state:"multi",text:hits.length+" fees share this symbol. Mark it by hand.",hits};
  const h=hits[0];
  if(h.kind==="group"){const v=(h.kid.groupPaid||{})[h.m];const who=h.kid.name+" · "+nm("students",h.kid.groupId)+", "+monthLabel(h.m);
    if(v==="paid")return {state:"done",text:"Already paid",who,h};
    const fee=groupFee(h.kid);return {state:fee&&tx.amount<fee?"diff":"ok",text:fee&&tx.amount<fee?`Less than the fee (${money(fee)})`:"Mark month paid",who,h,check:!(fee&&tx.amount<fee)}}
  const b=h.b,d=billDue(b),who=(b.name||nm("students",b.studentId))+" · "+monthLabel(b.month);
  if(!d.total)return {state:"done",text:"Already paid",who,h};
  if(tx.amount===d.total)return {state:"ok",text:d.lesson&&d.books?"Lesson fee + books paid":d.books?"Books paid":"Lesson fee paid",who,h,set:{paid:d.lesson?true:b.paid,booksPaid:d.books?true:!!b.booksPaid},check:true};
  if(d.lesson&&tx.amount===d.lesson)return {state:"ok",text:"Lesson fee paid"+(d.books?" (books still open)":""),who,h,set:{paid:true},check:true};
  if(d.books&&tx.amount===d.books)return {state:"ok",text:"Books paid",who,h,set:{booksPaid:true},check:true};
  return {state:"diff",text:`Amount differs: due ${money(d.total)}`,who,h,set:tx.amount>=d.total?{paid:true,booksPaid:d.books?true:!!b.booksPaid}:{paid:true},check:false};
}

  const booksDue=s=>(Array.isArray(s.books)?s.books:[]).filter(b=>!b.paid&&mOf(b.date||"")===month).reduce((a,b)=>a+(Number(b.price)||0),0)||null;
  for(const x of P){const s=S.students[x.studentId];if(s&&s.status==="left")continue;const c=s?planCalc(s,month,0):null;const r=stripMeta(x);delete r.createdAt;delete r.updatedAt;delete r.paidVia;delete r.paidOn;delete r.paidAmount;
    Object.assign(r,{month,paid:false,booksPaid:false,books:s?booksDue(s):null,note:"",deduct:0,carry:0});
    if(s&&s.plan&&s.plan.type==="company"){const cr=creditRows(prev).find(z=>z.s.id===s.id);if(cr)r.carry=cr.left}
    else if(s&&s.plan&&["monthly","lesson"].includes(s.plan.type)){const mv=movedIn(s.id,month);if(mv){r.deduct=mv;r.note="−"+mv+" moved from "+monthLabel(prev).split(" ")[0];r.amount=planCalc(s,month,mv).amount}}if(c&&s.plan&&s.plan.type!=="package")r.amount=c.amount;if(s)done.add(s.id);
    if(!await save("billing",null,r))return;n++}
  let no=Math.max(0,...P.filter(x=>Number(x.section)===1).map(x=>Number(x.no)||0));
  for(const s of arr("students").filter(s=>s.status!=="left"&&planOf(s)&&s.plan.type!=="package"&&!done.has(s.id)).sort(byName)){const c=planCalc(s,month,0);if(!c)continue;no++;
    const mv=["monthly","lesson"].includes(s.plan.type)?movedIn(s.id,month):0;
    if(!await save("billing",null,{month,section:1,no:String(no).padStart(2,"0"),name:s.name,studentId:s.id,amount:mv?planCalc(s,month,mv).amount:c.amount,paid:false,books:booksDue(s),booksPaid:false,note:mv?"−"+mv+" moved from "+monthLabel(prev).split(" ")[0]:"",deduct:mv,carry:0}))return;n++}
  toast(n+" fees made for "+monthLabel(month));
}
/* ---------- book stock ---------- */
function stockSold(k){const t=(k.title||"").trim().toLowerCase();const out=[];arr("students").forEach(s=>(Array.isArray(s.books)?s.books:[]).forEach(b=>{if(b.stockId===k.id||(!b.stockId&&t&&(b.title||"").trim().toLowerCase()===t))out.push({s,b})}));return out}
function editStock(id){
  const v=id?S.bookstock[id]:{};
  form({title:id?"Edit book · "+v.title:"Add book to stock",values:v,fields:[
    {id:"title",label:"Book",required:true,full:true,ph:"English File Elementary, Student's Book"},
    {id:"language",label:"Language",ph:"English"},{id:"level",label:"Level",ph:"A1, Kids 2…"},
    {id:"buyPrice",label:"We pay ("+S.settings.currency+")",type:"number",min:0},{id:"sellPrice",label:"We sell for ("+S.settings.currency+")",type:"number",min:0},
    {id:"received",label:"Copies received in total",type:"number",min:0},{id:"supplier",label:"Bought from",ph:"Bookshop, publisher…"},
    {id:"note",label:"Note",type:"textarea",full:true}],
    onSave:x=>save("bookstock",id,Object.assign({},id?stripMeta(v):{},x)),
    onDelete:id?()=>del("bookstock",id):null});
}
function vBooks(){
  const K=arr("bookstock").sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  let inv=0,earn=0,owed=0;
  const rows=K.map(k=>{const sold=stockSold(k), left=(Number(k.received)||0)-sold.length, unpaid=sold.filter(x=>!x.b.paid);
    const income=sold.reduce((a,x)=>a+(Number(x.b.price)||0),0);inv+=Math.max(0,left)*(Number(k.buyPrice)||0);earn+=income-sold.length*(Number(k.buyPrice)||0);owed+=unpaid.reduce((a,x)=>a+(Number(x.b.price)||0),0);
    return `<tr class="click" data-stock="${esc(k.id)}"><td><b>${esc(k.title)}</b>${k.language||k.level?`<div class="muted" style="font-size:12px">${esc([k.language,k.level].filter(Boolean).join(" · "))}</div>`:""}</td>
    <td class="num">${k.buyPrice!=null?money(k.buyPrice):"–"}</td><td class="num">${k.sellPrice!=null?money(k.sellPrice):"–"}</td><td class="num">${Number(k.received)||0}</td><td class="num">${sold.length}</td>
    <td class="num"><b class="${left<=0?"late":left<=2?"warn-t":""}">${left}</b></td><td>${sold.map(x=>`<span class="bk ${x.b.paid?"paid":"due"}" title="${esc(x.b.paid?"paid":"not paid yet")}">${esc(x.s.name)}</span>`).join(" ")}</td></tr>`}).join("");
  return `<div class="head"><div><h1>Books</h1><p class="sub">The books the school keeps and sells. When you give a book to a student (Students › student › Add book), choose it from stock and it counts as sold.</p></div>
  <div class="tools">${canWrite?`<button class="btn pri" type="button" data-stockadd>Add book</button>`:""}</div></div>
  ${K.length?`<div class="kpis"><div class="kpi"><span>Titles</span><b>${K.length}</b></div><div class="kpi"><span>Stock value (what we paid)</span><b>${money(inv)}</b></div><div class="kpi"><span>Earned on sold books</span><b style="color:var(--good)">${money(earn)}</b></div><div class="kpi"><span>Not paid yet by students</span><b style="color:var(--bad)">${money(owed)}</b></div></div>
  <div class="tbl-wrap"><table class="paytbl"><thead><tr><th>Book</th><th class="num">We pay</th><th class="num">We sell</th><th class="num">Received</th><th class="num">Sold</th><th class="num">Left</th><th>Given to</th></tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="panel empty">No books in stock yet. Add the titles you keep, with what you pay, what you sell them for, and how many copies you have.</div>`}`;
}

  main.querySelectorAll("[data-tadd]").forEach(b=>b.onclick=()=>{const [tid,d]=b.dataset.tadd.split("|");editLesson(null,{teacherId:tid,date:d})});
  main.querySelectorAll(".tb").forEach(c=>c.onkeydown=e=>{if(e.key==="Enter"&&e.target===c)c.click()});
  main.querySelectorAll("[data-qt]").forEach(inp=>{
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}else if(e.key==="Escape"){inp.value=(S.lessons[inp.dataset.qt]||{}).time||"";inp.blur()}};
    inp.onchange=async()=>{const id=inp.dataset.qt;const t=normTime(inp.value);if(!t){toast("Type a time like 16:10");inp.value=(S.lessons[id]||{}).time||"";return}inp.value=t;if((S.lessons[id]||{}).time===t)return;if(await patch("lessons",id,{time:t}))toast("Time changed to "+t)}});
  main.querySelectorAll("details.pop").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)main.querySelectorAll("details.pop").forEach(o=>{if(o!==d)o.open=false})}));
  main.querySelectorAll("[data-jump]").forEach(b=>b.onclick=e=>{e.stopPropagation();const c=document.getElementById("cell-"+b.dataset.jump);if(!c)return;c.scrollIntoView({block:"center",inline:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash")});
  main.querySelectorAll("[data-sst]").forEach(sel=>{sel.addEventListener("click",e=>e.stopPropagation());sel.onchange=async e=>{e.stopPropagation();if(await patch("students",sel.dataset.sst,{status:sel.value}))toast(nm("students",sel.dataset.sst)+": "+(STU_ST.find(x=>x[0]===sel.value)||["",""])[1])}});
  main.querySelectorAll("[data-onote]").forEach(b=>b.onclick=e=>{e.stopPropagation();addOfficeNote(b.dataset.onote)});
  main.querySelectorAll("[data-snote]").forEach(t=>{const fit=()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight+2,140)+"px"};fit();t.addEventListener("click",e=>e.stopPropagation());t.addEventListener("keydown",e=>e.stopPropagation());t.oninput=fit;t.onchange=async()=>{const id=t.dataset.snote,v=t.value.trim();if(v===((S.students[id]||{}).notes||"").trim())return;if(await patch("students",id,{notes:v}))toast(nm("students",id)+": note saved")}});
  main.querySelectorAll("[data-sl],[data-sa]").forEach(sel=>{sel.addEventListener("click",e=>e.stopPropagation());sel.onchange=async e=>{e.stopPropagation();const id=sel.dataset.sl||sel.dataset.sa, f=sel.dataset.sl?"language":"ageGroup";if(await patch("students",id,{[f]:sel.value}))toast(nm("students",id)+": "+(sel.value?(f==="ageGroup"?(sel.value==="kid"?"Kid":"Adult"):sel.value):"cleared"))}});
  main.querySelectorAll("[data-qe]").forEach(inp=>{
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}else if(e.key==="Escape"){inp.value=endTime(S.lessons[inp.dataset.qe]||{});inp.blur()}};
    inp.onchange=async()=>{const id=inp.dataset.qe, l=S.lessons[id]||{};const t=normTime(inp.value), st=toMin(l.time);
      if(!t||st==null||toMin(t)<=st){toast(st==null?"Set the start time first.":"Type an end time after the start, like 17:25");inp.value=endTime(l);return}
      const dur=toMin(t)-st;inp.value=t;if(Number(l.duration)===dur){if(l.endTime)await patch("lessons",id,{endTime:""});return}
      if(await patch("lessons",id,{endTime:t}))toast("⚠ "+t+" doesn't match "+l.duration+" min. Choose which one is right.")}});
  main.querySelectorAll("[data-mm]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const [id,k]=b.dataset.mm.split("|");const l=S.lessons[id];const m=l&&timeMismatch(l);if(!m)return;
    if(await patch("lessons",id,k==="span"?{duration:m.span,endTime:""}:{endTime:""}))toast(k==="span"?"Lesson is now "+m.span+" min":"Kept "+m.dur+" min")});
  main.querySelectorAll("[data-qr]").forEach(sel=>sel.onchange=async()=>{const id=sel.dataset.qr;if(await patch("lessons",id,{classroomId:sel.value}))toast(sel.value?"Moved to "+nm("classrooms",sel.value):"Room removed")});
  main.querySelectorAll("[data-dsch]").forEach(b=>b.onclick=()=>{b.closest("details")&&(b.closest("details").open=false);enterTpl()});
  main.querySelectorAll("[data-tplexit]").forEach(b=>b.onclick=exitTpl);
  main.querySelectorAll("[data-wk2]").forEach(b=>b.onclick=async()=>{const k=b.dataset.wk2;b.closest("details")&&(b.closest("details").open=false);
    const rng=w=>{const e=addDays(w,6);return `${Number(w.slice(8))}.${Number(w.slice(5,7))}. – ${Number(e.slice(8))}.${Number(e.slice(5,7))}.`},tpN=((S.template&&S.template.lessons)||[]).length;
    const Q={copy:["Copy last week?",`Copies last week's ${weekLessons(addDays(week,-7)).filter(l=>l.status!=="cancelled").length} lessons (${rng(addDays(week,-7))}) into this week (${rng(week)}), for all teachers and students. Lessons already there are skipped.`,"Yes, copy last week"],
      save:["Save this week as the default?",`The default schedule will be replaced by this week (${rng(week)}): ${weekLessons(week).filter(l=>!freesRoom(l)).length} lessons for all teachers.${tpN?` The current default (${tpN} lessons) will be overwritten.`:""}`,"Yes, replace the default"],
      fillone:["Fill this week from the default?",`Adds the ${tpN} default lessons to ${rng(week)} for all teachers and students. Lessons already there are skipped.`,"Yes, fill this week"],
      fill:["Fill the next 4 weeks from the default?",`Adds the ${tpN} default lessons to each of the 4 weeks after this one (${rng(addDays(week,7))} to ${rng(addDays(week,28))}) for all teachers and students. Lessons already there are skipped.`,"Yes, fill 4 weeks"]}[k];
    if(!await confirmBox(...Q))return;
    b.disabled=true;if(k==="copy")await copyLastWeek();else if(k==="save")await saveDefaultWeek();else if(k==="fillone")await fillThisWeek();else await fillFromDefault()});
  main.querySelectorAll("[data-dsee]").forEach(b=>b.onclick=()=>{b.closest("details")&&(b.closest("details").open=false);openDefault()});
  main.querySelectorAll(".rc").forEach(c=>c.onkeydown=e=>{if(e.key==="Enter"&&e.target===c)c.click()});
  main.querySelectorAll(".lcard").forEach(c=>c.onkeydown=e=>{if(e.key==="Enter"&&e.target===c)c.click()});
  main.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>({classroom:()=>editClassroom(),student:()=>editStudent(),teacher:()=>editTeacher(),lesson:()=>editLesson(null,filt.student?{studentId:filt.student}:{}),payment:()=>editPayment(),material:()=>editMaterial()})[b.dataset.new]());
  main.querySelectorAll("[data-paystu]").forEach(b=>b.onclick=()=>editPayment(null,b.dataset.paystu));
  main.querySelectorAll(".card[data-mat]").forEach(c=>c.onkeydown=e=>{if(e.key==="Enter")c.click()});
  main.querySelectorAll(".card a").forEach(a=>a.onclick=e=>e.stopPropagation());
  const q=main.querySelector("#q");if(q)q.oninput=()=>{filt.q=q.value;render()};
  const ft=main.querySelector("#ft");if(ft)ft.onchange=()=>{filt.teacher=ft.value;render()};
  const fs=main.querySelector("#fs");if(fs)fs.onchange=()=>{filt.status=fs.value;render()};
  const fst=main.querySelector("#fst");if(fst)fst.onchange=()=>{filt.student=fst.value;render()};
  const csv=main.querySelector("#csv");if(csv)csv.onclick=exportCsv;
  const rm=main.querySelector("#rmex");if(rm)rm.onclick=async()=>{
    if(rm.dataset.arm!=="1"){rm.dataset.arm="1";rm.textContent="Click again to remove all examples";return}
    rm.disabled=true;rm.textContent="Removing…";
    for(const c of COLS)for(const x of arr(c).filter(x=>x.example)){if(!await del(c,x.id))return}
    toast("Example data removed");
  };
}
function setView(){if(lock){render();return}const h=(location.hash||"").slice(1);view=VIEWS.some(v=>v[0]===h)?h:"timetable";filt.q="";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",setView);
let accLoaded=false;setInterval(()=>{if(!accLoaded&&loaded.access&&userNS){accLoaded=true;loadAccProfiles().then(()=>{if(view==="access")render()})}},1000);
let rT;function schedule(){clearTimeout(rT);rT=setTimeout(()=>{render();const m=document.querySelector(".modal.wide");if(m&&openSid)openStudent(openSid)},60)}
let openSid=null;const _os=openStudent;openStudent=function(id){openSid=id;_os(id)};
const _cm=closeModal;closeModal=function(){openSid=null;_cm()};

async function exportCsv(){
  const rows=[["Student","Teacher","Month","From last month","Bought","Used","Moved","To next month","Paid"]].concat(reportRows().map(({s,l})=>[s.name,nm("teachers",s.teacherId),month,l.carriedIn,l.bought,l.done,l.moved,l.carriedOut,l.paidM]));
  const text=rows.map(r=>r.map(v=>{const x=String(v==null?"":v);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(",")).join("\n");
  await offer("won-academy-report-"+month+".csv",text);
}
async function offer(filename,data){
  if(!downloads){toast("Downloads aren't available in this view.");return}
  try{await downloads.save({filename,data})}catch(e){if(e&&e.code!=="cancelled")toast("The file wasn't saved.")}
}
document.getElementById("btn-backup").onclick=()=>{const o={exportedAt:new Date().toISOString(),settings:S.settings,template:S.template||null};COLS.forEach(c=>o[c]=arr(c));offer("won-academy-backup-"+today()+".json",JSON.stringify(o,null,2))};
/* time boxes: select on focus, auto-format 4 digits (1430 → 14:30) */
document.addEventListener("focusin",e=>{const t=e.target;if(t.matches&&t.matches(".ts-time,.ts-stu,#f-time,#f-endTime,#f-rsTime,#f-mkTime"))setTimeout(()=>{try{t.select()}catch(x){}},0)});
document.addEventListener("input",e=>{const t=e.target;if(!(t.matches&&t.matches(".ts-time,#f-time,#f-endTime,#f-rsTime,#f-mkTime")))return;const v=t.value.trim();
  if(/^\d{4}$/.test(v)||/^\d{1,2}[:.h]\d{2}$/.test(v)){const n=normTime(v);if(n&&n!==v){t.value=n;if(t.classList.contains("ts-time"))t.dispatchEvent(new Event("change",{bubbles:true}));else t.dispatchEvent(new Event("input",{bubbles:true}))}}},true);
setInterval(()=>{const ae=document.activeElement;if(document.getElementById("modal-root").innerHTML.trim()||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))return;try{render()}catch(e){}},300000);
document.getElementById("btn-menuord").onclick=()=>{if(!canWrite||lock){toast("Only the office can arrange the menu.");return}menuEdit=!menuEdit;render()};
document.getElementById("btn-settings").onclick=()=>canWrite?editSettings():toast("You have view-only access.");

/* ---------- boot ---------- */
setView();
(async()=>{
  const timer=setTimeout(()=>{if(dbState==="loading"){const m=document.getElementById("loadmsg");if(m)m.textContent="The register can't be reached yet. Check your connection; it will load as soon as it can."}},10000);
  try{db=await window.claude?.use?.("db");if(db)db=wrapDb(db)}catch(e){db=null}
  try{downloads=await window.claude?.use?.("downloads")}catch(e){}
  try{assets=await window.claude?.use?.("assets")}catch(e){assets=null}
  if(!db){clearTimeout(timer);dbState="none";render();return}
  try{const u=await window.claude.use("user");userNS=u;if(u){const w=await u.can("data.write");if(w===false)canWrite=false;meInfo=await u.me();isAdminViewer=!!(meInfo&&(meInfo.isOwner||meInfo.canEdit))}}catch(e){}
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())});S[c]=o;if(c==="lessons"){S.rawLessons=o;setLens()}
      if(!snap.metadata.fromCache)loaded[c]=true;else loaded[c]=loaded[c]||snap.size>0;
      if(COLS.every(x=>loaded[x])){clearTimeout(timer);dbState="ready"}
      schedule();
    },err=>{loaded[c]=true;clearTimeout(timer);dbState="ready";schedule();if(err&&err.code!=="revoked")toast("Some data couldn't load. Reload the page later.")});
  });
  db.doc("settings/template").onSnapshot(d=>{S.template=d.exists?d.data():null;schedule()},()=>{});
  db.doc("settings/main").onSnapshot(d=>{if(d.exists)S.settings=Object.assign({},S.settings,d.data());schedule()},()=>{});
})();
})();
</script>
